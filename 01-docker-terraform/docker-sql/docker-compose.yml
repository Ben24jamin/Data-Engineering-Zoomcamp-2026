services:
  postgres:
    container_name: postgres
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASS}
      - POSTGRES_DB=${PG_DB}
    ports:
      - "${PG_PORT}:5432"  
    #command: ["postgres", "-p", "5433"]  ##this explicitly tells Postgres to listen on port 5433 inside the container
    volumes:
      - ny_taxi_postgres_data:/var/lib/postgresql
    networks:
      - pg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"] 

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}  
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}  
    ports:
      - "${PGADMIN_PORT}:80"  
    volumes:
      - ny_taxi-vol-pgadmin_data:/var/lib/pgadmin
    networks:
      - pg-network
    depends_on:
      - postgres

  ingest:
    build: .
    env_file:
      - .env
    command : ["python", "ingest_data.py"]
    networks:
      - pg-network 
    depends_on:
      - postgres      

volumes:
 ny_taxi-vol-pgdata:

 ny_taxi-vol-pgadmin_data:


networks:
  pg-network:
    driver: bridge